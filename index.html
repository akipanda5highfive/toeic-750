<meta charset="utf-8">

<title>TOEIC750・英検準1級 統合単語チャレンジ</title>
<style>
:root {
  --bg:#fff7c9; --card:#fffefa; --text:#252119; --muted:#756b56;
  --line:#eadb9c; --accent:#f2bd16; --accent-deep:#d99b00;
  --good:#16834f; --bad:#c73e3e;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:
    radial-gradient(circle at 10% 8%, rgba(255,255,255,.9) 0 36px, transparent 37px),
    radial-gradient(circle at 86% 18%, rgba(255,255,255,.72) 0 28px, transparent 29px),
    linear-gradient(180deg,#fff5ae 0%,#fffbe6 48%,#fff4b6 100%);
  color:var(--text);
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP","Noto Sans KR",sans-serif;
  min-height:100vh;
}
main { width:min(760px,100%); margin:auto; padding:18px 14px 40px; }
h1 { font-size:1.35rem; margin:4px 0 6px; }
.sub { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.035);
}
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
label { display:block; font-size:.86rem; color:var(--muted); margin-bottom:5px; }
select,input[type=number],input[type=text] {
  width:100%; min-height:44px; border:1px solid var(--line); border-radius:10px;
  padding:9px 11px; font-size:16px; background:#fff; color:var(--text);
}
.row { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
.check { display:flex; gap:7px; align-items:center; color:var(--text); font-size:.94rem; }
button {
  border:0; border-radius:10px; padding:11px 15px; font-size:15px; font-weight:650;
  cursor:pointer; min-height:44px;
}
.primary { background:var(--accent); color:white; }
.secondary { background:#edf0f6; color:var(--text); }
.danger { background:#f9eaea; color:var(--bad); }
button:disabled { opacity:.48; cursor:not-allowed; }
.hidden { display:none !important; }
.topbar { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.progress { color:var(--muted); font-size:.9rem; }
.question {
  text-align:center; font-size:clamp(2rem,9vw,3.8rem); font-weight:750;
  line-height:1.25; padding:23px 8px 18px; overflow-wrap:anywhere;
}
.prompt { text-align:center; color:var(--muted); margin-top:2px; }
.choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
.choice {
  background:#f7f8fb; color:var(--text); border:1px solid var(--line);
  min-height:58px; text-align:left; overflow-wrap:anywhere;
}
.choice.correct { background:#e8f6ef; border-color:#79c69e; color:#0d6b3c; }
.choice.wrong { background:#fceeee; border-color:#dc9696; color:#a72c2c; }
.feedback { min-height:48px; margin-top:12px; font-weight:650; line-height:1.5; }
.good {
  color:var(--good);
  background:#e8f6ef;
  border:2px solid #79c69e;
  border-radius:12px;
  padding:12px 14px;
}
.bad {
  color:#a90000;
  background:#ffe2e2;
  border:3px solid #d60000;
  border-radius:12px;
  padding:14px 16px;
  font-size:1.1rem;
  font-weight:800;
  box-shadow:0 0 0 3px rgba(214,0,0,.08);
}
.star {
  background:transparent; font-size:28px; padding:3px 8px; min-height:auto;
  color:#9aa1ab;
}
.star.on { color:#e2a500; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.stat { text-align:center; background:#f7f8fb; border-radius:10px; padding:9px 4px; }
.stat b { display:block; font-size:1.15rem; }
.stat span { color:var(--muted); font-size:.76rem; }
.answer-row { display:flex; gap:8px; margin-top:14px; }
.answer-row input { flex:1; }
.small { font-size:.82rem; color:var(--muted); }
.result-big { font-size:2rem; font-weight:800; text-align:center; margin:10px 0; }
@media (max-width:560px) {
  .grid,.choices { grid-template-columns:1fr; }
  .stats { grid-template-columns:repeat(2,1fr); }
  main { padding:12px 10px 28px; }
  .card { padding:13px; border-radius:12px; }
}

  .quiz-actions {
    display:flex;
    gap:12px;
    align-items:stretch;
    margin-top:14px;
  }
  .quiz-actions #nextBtn {
    flex:1;
    min-height:56px;
    font-size:18px;
    font-weight:800;
  }
  .quiz-actions #markWrongBtn {
    flex:1;
    min-height:56px;
    font-size:16px;
    font-weight:700;
    background:#fff4dc;
    color:#9a5700;
    border:2px solid #efb54d;
  }
  .quiz-actions #markWrongBtn.marked {
    background:#ffe3e3;
    color:#b42318;
    border-color:#e26b6b;
  }
  #stopBtn {
    font-size:13px;
    padding:8px 12px;
    min-height:auto;
    color:#a33;
    background:#fff;
    border:1px solid #d8a3a3;
  }
  @media (max-width:600px) {
    .quiz-actions {
      flex-direction:column;
    }
    .quiz-actions #nextBtn {
      order:1;
    }
    .quiz-actions #markWrongBtn {
      order:2;
    }
  }


main { width:min(820px,100%); padding-top:14px; }
.app-header {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 14px;
  padding:14px 16px;
  border:1px solid rgba(219,167,0,.35);
  border-radius:22px;
  background:rgba(255,255,255,.74);
  box-shadow:0 8px 22px rgba(173,124,0,.10);
  overflow:hidden;
}
.app-title-wrap { min-width:0; }
.app-title-wrap h1 { margin:0 0 4px; font-size:clamp(1.25rem,4.5vw,1.75rem); }
.app-title-wrap .sub { margin:0; color:#74633f; }
.mascot-row { display:none; }

main { position:relative; }

.floating-mascot {
  position:absolute;
  z-index:3;
  pointer-events:none;
  filter:drop-shadow(0 4px 3px rgba(120,85,0,.14));
  opacity:.98;
}
.floating-mascot.chick {
  width:72px;
  height:72px;
  top:4px;
  right:18px;
  transform:rotate(5deg);
}
.floating-mascot.ermine {
  width:60px;
  height:60px;
  top:205px;
  left:-8px;
  transform:rotate(-8deg);
}
.floating-mascot.wolf {
  width:72px;
  height:66px;
  top:455px;
  right:-8px;
  transform:rotate(6deg);
}

.card {
  border:1px solid rgba(219,167,0,.32);
  border-radius:20px;
  box-shadow:0 8px 22px rgba(142,103,0,.08);
}
.primary {
  background:linear-gradient(180deg,#ffd944,#f2b900);
  color:#302500;
  box-shadow:0 4px 0 #d89d00;
}
.primary:active { transform:translateY(2px); box-shadow:0 2px 0 #d89d00; }
.secondary { background:#fff8df; border:1px solid #ead78d; }
select,input[type=number],input[type=text] {
  border-color:#e5d69c;
  background:#fffefa;
}
.choice {
  border:2px solid #efdda0;
  border-radius:16px;
  background:linear-gradient(180deg,#fffef8,#fff9df);
  min-height:68px;
  padding:15px 16px;
}
.choice:hover { border-color:#e9bd2b; }
.choice.correct { background:#effbee; border-color:#74c997; }
.choice.wrong { background:#fff0f0; border-color:#e08d8d; }

/* English text is deliberately larger on iPhone/iPad. */
.question[data-lang="ko"] {
  font-size:clamp(3.2rem,15vw,5.8rem);
  letter-spacing:.015em;
}
.question[data-lang="ja"] {
  font-size:clamp(1.55rem,6.5vw,2.65rem);
  line-height:1.35;
}
.choice[data-lang="ko"] {
  font-size:clamp(1.8rem,7.4vw,2.55rem);
  line-height:1.3;
  font-weight:800;
  text-align:center;
  min-height:82px;
}
.choice[data-lang="ja"] {
  font-size:clamp(1rem,4vw,1.22rem);
  line-height:1.45;
}
#answerInput.english-input {
  font-size:1.55rem;
  min-height:56px;
}

/* End button stays in one stable, separate place during the quiz. */
#stopBtn {
  position:fixed;
  top:calc(env(safe-area-inset-top, 0px) + 10px);
  right:12px;
  z-index:1000;
  min-width:72px;
  min-height:48px;
  padding:8px 12px;
  border-radius:16px;
  color:#bd3030;
  background:#fff;
  border:2px solid #efb4b4;
  box-shadow:0 5px 16px rgba(116,45,45,.15);
  font-size:14px;
  font-weight:800;
}
#quiz:not(.hidden) { padding-top:58px; }
#quiz .topbar .row { padding-right:0; }
.quiz-actions #nextBtn {
  background:linear-gradient(180deg,#ffdc48,#f4bd00);
}
.quiz-actions #markWrongBtn {
  border-radius:16px;
}
.stat { background:#fff9e4; }
.star.on { color:#f2b800; }

.cute-note {
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
  color:#856b22;
  font-size:.82rem;
}
.cute-dot {
  width:8px;height:8px;border-radius:50%;
  background:#f3be1d;box-shadow:14px 0 #ffe06c,28px 0 #f3be1d;
  margin-right:28px;
}

@media (max-width:600px) {
  main { padding:10px 9px 30px; }
  .app-header { padding:11px 12px; border-radius:18px; }
  .floating-mascot.chick { width:56px; height:56px; top:7px; right:10px; }
  .floating-mascot.ermine { width:48px; height:48px; top:215px; left:-3px; }
  .floating-mascot.wolf { width:56px; height:52px; top:500px; right:-3px; }
  .app-title-wrap .sub { font-size:.78rem; }
  #quiz { padding-left:11px; padding-right:11px; }
  .question { padding-top:18px; }
  .choice { min-height:72px; }
  .topbar { align-items:flex-start; }
  #speakBtn { min-width:88px; }
}

/* 統一イラスト版：絵文字や簡易SVGを使わず、同じ絵柄の動物画像を表示 */

  gain.connect(ctx.destination);
  oscillator.start(startTime);
  oscillator.stop(startTime + duration + 0.03);
}

async function unlockAudio() {
  const ctx = await getReadyAudioContext();
  if (!ctx) return false;
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();
  gain.gain.value = 0.0001;
  oscillator.connect(gain);
  gain.connect(ctx.destination);
  oscillator.start();
  oscillator.stop(ctx.currentTime + 0.02);
  return true;
}

async function playCorrectSound() {
  const ctx = await getReadyAudioContext();
  if (!ctx) return;
  const now = ctx.currentTime + 0.02;
  scheduleTone(ctx, 659.25, now, 0.16, 0.18, "sine");
  scheduleTone(ctx, 783.99, now + 0.12, 0.18, 0.18, "sine");
  scheduleTone(ctx, 1046.50, now + 0.24, 0.30, 0.20, "sine");
}

async function playWrongSound() {
  const ctx = await getReadyAudioContext();
  if (!ctx) return;
  const now = ctx.currentTime + 0.02;

  // Two clearly audible descending buzzer tones.
  scheduleTone(ctx, 240, now, 0.22, 0.24, "square");
  scheduleTone(ctx, 165, now + 0.20, 0.34, 0.26, "square");
}


function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    return {
      attempts: Number(s?.attempts)||0,
      correct: Number(s?.correct)||0,
      wrong: Array.isArray(s?.wrong) ? s.wrong : [],
      favorites: Array.isArray(s?.favorites) ? s.favorites : []
    };
  } catch(e) {
    return {attempts:0,correct:0,wrong:[],favorites:[]};
  }
}
function saveState() { localStorage.setItem(KEY, JSON.stringify(state)); renderStats(); }
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if(!p || !Array.isArray(p.wordNos) || !p.wordNos.length) return null;
    const nextIndex = Math.max(0, Number(p.nextIndex)||0);
    if(nextIndex >= p.wordNos.length) return null;
    return {...p, nextIndex};
  } catch(e) {
    return null;
  }
}
function saveProgress(nextIndex=session?.index||0) {
  if(!session || !Array.isArray(session.words) || !session.words.length) return;
  const progress = {
    wordNos: session.words.map(w=>w.no),
    nextIndex: Math.max(0, Number(nextIndex)||0),
    correct: Number(session.correct)||0,
    wrongNos: Array.isArray(session.wrongNos) ? session.wrongNos : [],
    direction: session.direction,
    mode: session.mode,
    randomized: !!session.randomized,
    range: session.range,
    selectedDay: Number(byId("selectedDay")?.value)||1,
    settings: {
      direction: byId("direction")?.value || "ko-ja",
      mode: byId("mode")?.value || "choice",
      range: byId("range")?.value || "day",
      course: byId("course")?.value || "eiken",
      randomize: !!byId("randomize")?.checked
    }
  };
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  savedProgress=progress;
}
function clearProgress() {
  localStorage.removeItem(PROGRESS_KEY);
  savedProgress=null;
  updateResumeButton();
}
function updateResumeButton() {
  const btn=byId("startBtn");
  if(!btn) return;
  if(savedProgress) {
    const remaining=savedProgress.wordNos.length-savedProgress.nextIndex;
    btn.textContent=`▶ 前回の続きから（残り${remaining}語）`;
  } else {
    btn.textContent="▶ 学習を始める";
  }
}
function restoreSavedSettings() {
  if(!savedProgress) return;
  const st=savedProgress.settings||{};
  if(st.direction) byId("direction").value=st.direction;
  if(st.mode) byId("mode").value=st.mode;
  if(st.course) byId("course").value=st.course;
  if(st.range) byId("range").value=st.range;
  if(typeof st.randomize==="boolean") byId("randomize").checked=st.randomize;
  selectDay(savedProgress.selectedDay||1);
  if(st.range) byId("range").value=st.range;
  updateRangeNote();
}
function resumeQuiz() {
  if(!savedProgress) return false;
  const map=new Map(WORDS.map(w=>[w.no,w]));
  const words=savedProgress.wordNos.map(no=>map.get(no)).filter(Boolean);
  if(!words.length || savedProgress.nextIndex>=words.length) {
    clearProgress();
    return false;
  }
  session={
    words,
    index:savedProgress.nextIndex,
    correct:Number(savedProgress.correct)||0,
    answered:false,
    wrongNos:Array.isArray(savedProgress.wrongNos)?savedProgress.wrongNos:[],
    direction:savedProgress.direction||"ko-ja",
    mode:savedProgress.mode||"choice",
    randomized:!!savedProgress.randomized,
    range:savedProgress.range||"day"
  };
  byId("setup").classList.add("hidden");
  byId("result").classList.add("hidden");
  byId("quiz").classList.remove("hidden");
  showQuestion();
  return true;
}

function byId(id) { return document.getElementById(id); }
function secureRandomInt(maxExclusive) {
  if(maxExclusive <= 1) return 0;
  if(window.crypto && window.crypto.getRandomValues) {
    const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
    const buf = new Uint32Array(1);
    let value;
    do {
      window.crypto.getRandomValues(buf);
      value = buf[0];
    } while(value >= limit);
    return value % maxExclusive;
  }
  return Math.floor(Math.random() * maxExclusive);
}
function shuffle(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--) {
    const j=secureRandomInt(i+1);
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}
function unique(arr) { return [...new Set(arr)]; }
function normalize(s) {
  return String(s??"").trim().toLowerCase()
    .replace(/[　\s]+/g,"")
    .replace(/[、，,。．.・／/（）()「」『』【】［］\[\]～~?？!！:：;；]/g,"");
}
function acceptedAnswers(text) {
  const parts = String(text).split(/[、，,／/]/).map(normalize).filter(Boolean);
  return unique([normalize(text), ...parts]);
}
function renderStats() {
  byId("allAttempts").textContent=state.attempts;
  byId("allCorrect").textContent=state.correct;
  byId("allRate").textContent=state.attempts ? Math.round(state.correct/state.attempts*100)+"%" : "0%";
  byId("favCount").textContent=state.favorites.length;
  updateRangeNote();
}
function coursePool(course=byId("course")?.value||"eiken") {
  if(course==="toeic") return WORDS.filter(w=>w.tags?.includes("toeic")).sort((a,b)=>(a.toeicRank||9999)-(b.toeicRank||9999));
  if(course==="eiken") return WORDS.filter(w=>w.tags?.includes("eiken")).sort((a,b)=>a.no-b.no);
  if(course==="common") return WORDS.filter(w=>w.tags?.includes("toeic")&&w.tags?.includes("eiken")).sort((a,b)=>(a.toeicRank||9999)-(b.toeicRank||9999));
  return [...WORDS].sort((a,b)=>a.no-b.no);
}
function dayBounds(day) {
  day=Math.max(1,Math.min(30,Number(day)||1));
  const pool=coursePool();
  const base=Math.floor(pool.length/30);
  const extra=pool.length%30;
  const startIndex=(day-1)*base+Math.min(day-1,extra);
  const size=base+(day<=extra?1:0);
  const slice=pool.slice(startIndex,startIndex+size);
  return {startIndex,size,slice};
}
function basePoolForRange() {
  const r=byId("range").value;
  if(r==="day") return dayBounds(byId("selectedDay").value).slice;
  if(r==="course") return coursePool();
  if(r==="wrong") {
    const set=new Set(state.wrong);
    return WORDS.filter(w=>set.has(w.no));
  }
  if(r==="favorite") {
    const set=new Set(state.favorites);
    return WORDS.filter(w=>set.has(w.no));
  }
  return [...WORDS];
}

function updateStartLimit() {
  const pool=basePoolForRange();
  const input=byId("startNo");
  const max=Math.max(1,pool.length);
  input.max=max;
  if((Number(input.value)||1)>max) input.value=max;
}

function updateRangeNote() {
  updateStartLimit();
  const pool=basePoolForRange();
  const order=byId("randomize")?.checked ? "ランダム" : "番号順";
  const rangeName=byId("range").selectedOptions[0]?.textContent || "";
  const courseName=byId("course")?.selectedOptions[0]?.textContent || "";
  if(byId("range").value==="day") {
    const day=Number(byId("selectedDay").value)||1;
    byId("rangeNote").textContent=`${courseName}・Day ${day}：${pool.length}語／${order}`;
  } else if(byId("range").value==="course") {
    byId("rangeNote").textContent=`${courseName}：${pool.length}語／${order}`;
  } else {
    byId("rangeNote").textContent=`${rangeName}：${pool.length}語／${order}`;
  }
}

function getPool() {
  return basePoolForRange();
}

function applyStartNumber(pool) {
  if(byId("range").value==="day") return pool;
  const max=Math.max(1,pool.length);
  const startPos=Math.max(1,Math.min(max,Number(byId("startNo").value)||1));
  byId("startNo").value=startPos;
  return pool.slice(startPos-1);
}

function startQuiz(customNos=null) {
  let pool;
  if(customNos) {
    const set=new Set(customNos);
    pool=WORDS.filter(w=>set.has(w.no));
  } else {
    pool=applyStartNumber(getPool());
  }

  if(!pool.length) {
    alert(byId("range").value==="wrong" ? "指定した開始番号以降に、間違えた単語がありません。" : "指定した開始番号以降に対象となる単語がありません。");
    return;
  }
  const requested=(byId("range").value==="course"||byId("range").value==="all"||byId("range").value==="wrong"||byId("range").value==="favorite") ? pool.length : Math.max(1, Math.min(Number(byId("count").value)||20, pool.length));
  if(byId("randomize").checked) pool=shuffle(pool);
  else pool=pool.sort((a,b)=>a.no-b.no);
  pool=pool.slice(0,requested);

  session={
    words:pool,index:0,correct:0,answered:false,wrongNos:[],
    direction:byId("direction").value,mode:byId("mode").value,
    randomized:byId("randomize").checked,
    range:byId("range").value
  };
  byId("setup").classList.add("hidden");
  byId("result").classList.add("hidden");
  byId("quiz").classList.remove("hidden");
  saveProgress(0);
  showQuestion();
}
function currentDirection() {
  return session.direction==="mix" ? (Math.random()<.5?"ko-ja":"ja-ko") : session.direction;
}
function currentMode() {
  return session.mode==="mix" ? (Math.random()<.5?"choice":"input") : session.mode;
}
function showQuestion() {
  session.answered=false;
  session.dir=currentDirection();
  session.qmode=currentMode();
  const w=session.words[session.index];
  const sourceTags=[];
  if(w.tags?.includes("toeic")) sourceTags.push(`TOEIC${w.toeicRank ? " No."+w.toeicRank : ""}`);
  if(w.tags?.includes("eiken")) sourceTags.push(`英検準1級${w.no<=3400 ? " No."+w.no : ""}`);
  const numberText=sourceTags.join("／");
  byId("progress").textContent=`${session.index+1} / ${session.words.length}　${numberText}　${session.randomized ? "🎲ランダム" : "番号順"}`;
  byId("prompt").textContent=session.dir==="ko-ja" ? "日本語の意味は？" : "英語では？";
  byId("question").textContent=session.dir==="ko-ja" ? w.ko : w.ja;
  byId("question").dataset.lang=session.dir==="ko-ja" ? "ko" : "ja";
  byId("feedback").textContent="";
  byId("feedback").className="feedback";
  byId("postAnswerActions").classList.remove("hidden");
  byId("preAnswerActions").classList.remove("hidden");
  byId("nextBtn").disabled=true;
  byId("nextBtn").textContent="次へ";
  byId("markWrongBtn").classList.add("hidden");
  byId("markWrongBtn").classList.remove("marked");
  byId("markWrongBtn").textContent="できなかったことにする";
  byId("markWrongBtn").disabled=false;
  byId("dontKnowBtn").disabled=false;
  byId("choices").innerHTML="";
  byId("answerInput").value="";
  updateStar();

  if(session.qmode==="choice") {
    byId("choices").classList.remove("hidden");
    byId("inputArea").classList.add("hidden");
    const correct=session.dir==="ko-ja" ? w.ja : w.ko;
    const isPredicate=w.ko.endsWith("다");
    let candidateWords=(session.range==="day"||session.range==="course" ? coursePool() : WORDS).filter(x=>x.no!==w.no);
    if(isPredicate) candidateWords=candidateWords.filter(x=>x.ko.endsWith("다"));
    const others=shuffle(candidateWords)
      .map(x=>session.dir==="ko-ja"?x.ja:x.ko)
      .filter((v,i,a)=>v!==correct && a.indexOf(v)===i)
      .slice(0,3);
    shuffle([correct,...others]).forEach(text=>{
      const b=document.createElement("button");
      b.className="choice"; b.textContent=text;
      b.dataset.lang=session.dir==="ja-ko" ? "ko" : "ja";
      b.onclick=async()=>{ await unlockAudio(); answer(text, b); };
      byId("choices").appendChild(b);
    });
  } else {
    byId("choices").classList.add("hidden");
    byId("inputArea").classList.remove("hidden");
    byId("answerInput").classList.toggle("english-input", session.dir==="ja-ko");
    setTimeout(()=>byId("answerInput").focus(),50);
  }
}
function answer(value, button=null) {
  if(session.answered) return;
  session.answered=true;
  const w=session.words[session.index];
  const correctText=session.dir==="ko-ja" ? w.ja : w.ko;
  const answers=acceptedAnswers(correctText);
  const ok=answers.includes(normalize(value));
  session.currentWasCorrect=ok;

  state.attempts++;
  if(ok) {
    state.correct++; session.correct++;
    state.wrong=state.wrong.filter(n=>n!==w.no);
    byId("feedback").textContent="正解！";
    byId("feedback").className="feedback good";
    playCorrectSound();
  } else {
    if(!state.wrong.includes(w.no)) state.wrong.push(w.no);
    if(!session.wrongNos.includes(w.no)) session.wrongNos.push(w.no);
    byId("feedback").textContent=`不正解　正解：${correctText}`;
    byId("feedback").className="feedback bad";
    playWrongSound();
  }
  saveState();
  saveProgress(session.index+1);

  if(session.qmode==="choice") {
    [...byId("choices").children].forEach(b=>{
      b.disabled=true;
      if(normalize(b.textContent)===normalize(correctText)) b.classList.add("correct");
    });
    if(button && !ok) button.classList.add("wrong");
  } else {
    byId("answerInput").disabled=true; byId("submitBtn").disabled=true;
  }
  byId("nextBtn").textContent=session.index===session.words.length-1 ? "結果を見る" : "次へ";
  byId("nextBtn").disabled=false;
  byId("preAnswerActions").classList.add("hidden");
  byId("postAnswerActions").classList.remove("hidden");
  byId("markWrongBtn").classList.remove("hidden");

  if(!ok) {
    byId("markWrongBtn").textContent="できなかったに登録済み";
    byId("markWrongBtn").classList.add("marked");
    byId("markWrongBtn").disabled=true;
  }
}
function markCurrentAsWrong() {
  if(!session || !session.answered) return;

  const w=session.words[session.index];

  if(!state.wrong.includes(w.no)) state.wrong.push(w.no);
  if(!session.wrongNos.includes(w.no)) session.wrongNos.push(w.no);

  // Correct-answer statistics are adjusted so an accidental guess
  // does not remain counted as mastered.
  if(session.currentWasCorrect) {
    state.correct=Math.max(0,state.correct-1);
    session.correct=Math.max(0,session.correct-1);
    session.currentWasCorrect=false;
  }

  saveState();
  byId("feedback").textContent += "　→ できなかった単語に登録しました";
  byId("feedback").className="feedback bad";
  byId("markWrongBtn").textContent="できなかったに登録済み";
  byId("markWrongBtn").classList.add("marked");
  byId("markWrongBtn").disabled=true;
  playWrongSound();
}

function answerDontKnow() {
  if(!session || session.answered) return;
  const w=session.words[session.index];
  const correctText=session.dir==="ko-ja" ? w.ja : w.ko;
  answer("__DONT_KNOW__");
  byId("feedback").textContent=`分からない　正解：${correctText}`;
  byId("feedback").className="feedback bad";
}
function nextQuestion() {
  if(!session.answered) return;
  if(session.index>=session.words.length-1) return finishQuiz();
  session.index++;
  saveProgress(session.index);
  byId("answerInput").disabled=false; byId("submitBtn").disabled=false;
  showQuestion();
}
function finishQuiz() {
  clearProgress();
  byId("quiz").classList.add("hidden");
  byId("result").classList.remove("hidden");
  const total=session.words.length;
  const rate=Math.round(session.correct/total*100);
  byId("resultBig").textContent=`${session.correct} / ${total}（${rate}%）`;
  byId("resultText").textContent=`今回の間違い：${session.wrongNos.length}語`;
  byId("retryWrongBtn").disabled=session.wrongNos.length===0;
}
function startNextSet() {
  const currentDay=Math.max(1, Number(byId("selectedDay")?.value)||1);
  const nextDay=currentDay>=30 ? 1 : currentDay+1;
  selectDay(nextDay);
  startQuiz();
}
function backToSetup() {
  byId("quiz").classList.add("hidden");
  byId("result").classList.add("hidden");
  byId("setup").classList.remove("hidden");
  session=null; renderStats();
}
function speakCurrentWord() {
  if(!session) return;
  if(!("speechSynthesis" in window)) {
    alert("このブラウザでは音声読み上げに対応していません。");
    return;
  }
  const word=session.words[session.index].ko;
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(word);
  utterance.lang="en-US";
  utterance.rate=0.88;
  utterance.pitch=1;
  const voices=window.speechSynthesis.getVoices();
  const englishVoice=voices.find(v=>String(v.lang).toLowerCase().startsWith("en"));
  if(englishVoice) utterance.voice=englishVoice;
  window.speechSynthesis.speak(utterance);
}
function toggleFavorite() {
  if(!session) return;
  const no=session.words[session.index].no;
  if(state.favorites.includes(no)) state.favorites=state.favorites.filter(n=>n!==no);
  else state.favorites.push(no);
  saveState(); updateStar();
}
function updateStar() {
  const no=session.words[session.index].no;
  const on=state.favorites.includes(no);
  byId("favoriteBtn").textContent=on?"★":"☆";
  byId("favoriteBtn").classList.toggle("on",on);
}
function renderDayCalendar() {
  const cal=byId("dayCalendar");
  if(!cal) return;
  cal.innerHTML="";
  const course=byId("course")?.value||"eiken";
  for(let day=1;day<=30;day++) {
    const b=dayBounds(day);
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="day-button"+(day===Number(byId("selectedDay").value)?" selected":"");
    let small="";
    if(b.slice.length) {
      if(course==="toeic" || course==="common") {
        const ranks=b.slice.map(w=>w.toeicRank).filter(Boolean);
        small=ranks.length ? `TOEIC ${Math.min(...ranks)}〜${Math.max(...ranks)}` : "";
      } else {
        small=`${b.startIndex+1}〜${b.startIndex+b.size}`;
      }
    }
    btn.innerHTML=`<b>Day ${day}</b><span>${b.size}語</span><small>${small}</small>`;
    btn.onclick=()=>selectDay(day);
    cal.appendChild(btn);
  }
}
function selectDay(day) {
  const b=dayBounds(day);
  byId("selectedDay").value=day;
  byId("range").value="day";
  byId("count").value=Math.max(1,b.size);
  byId("selectedDayBig").textContent=`Day ${day}`;
  const course=byId("course")?.value||"eiken";
  if(b.slice.length && (course==="toeic" || course==="common")) {
    const ranks=b.slice.map(w=>w.toeicRank).filter(Boolean);
    byId("selectedDayRange").textContent=ranks.length ? `TOEIC No.${Math.min(...ranks)}〜${Math.max(...ranks)}` : `${b.size}語`;
  } else {
    byId("selectedDayRange").textContent=`${b.size}語`;
  }
  byId("todayWordCount").textContent=`${b.size}語`;
  renderDayCalendar();
  updateRangeNote();
}
byId("startBtn").onclick=async()=>{ await unlockAudio(); if(!resumeQuiz()) startQuiz(); };
byId("speakBtn").onclick=speakCurrentWord;
byId("dontKnowBtn").onclick=answerDontKnow;
byId("submitBtn").onclick=async()=>{ await unlockAudio(); answer(byId("answerInput").value); };
byId("answerInput").addEventListener("keydown",async e=>{if(e.key==="Enter") {
  if(!session.answered) { await unlockAudio(); answer(byId("answerInput").value); }
  else nextQuestion();
}});
byId("nextBtn").onclick=nextQuestion;
byId("markWrongBtn").onclick=markCurrentAsWrong;
byId("stopBtn").onclick=()=>{ if(confirm("テストを終了しますか？")) finishQuiz(); };
byId("favoriteBtn").onclick=toggleFavorite;
byId("backBtn").onclick=backToSetup;
byId("nextSetBtn").onclick=startNextSet;
byId("retryWrongBtn").onclick=()=>startQuiz(session.wrongNos);
byId("course").addEventListener("change", ()=>{
  clearProgress();
  selectDay(1);
  renderDayCalendar();
  updateRangeNote();
  updateResumeButton();
});
byId("range").onchange=()=>{
  byId("startNo").value=1;
  const pool=basePoolForRange();
  byId("count").value=Math.max(1,pool.length);
  updateRangeNote();
};
byId("startNo").oninput=updateRangeNote;
byId("randomize").onchange=updateRangeNote;
byId("resetStatsBtn").onclick=()=>{
  if(confirm("正答率・間違い・お気に入りの記録をすべて消しますか？")) {
    state={attempts:0,correct:0,wrong:[],favorites:[]}; clearProgress(); saveState();
  }
};
if(savedProgress) restoreSavedSettings();
else selectDay(1);
renderStats();
updateResumeButton();
</script>
